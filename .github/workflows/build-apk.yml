      - name: Apply DramaVerse app icon from logo.png
        run: |
          if [ -f "logo.png" ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick
            RES_DIR="android/app/src/main/res"
            rm -f "$RES_DIR/mipmap-anydpi-v26/ic_launcher.xml" "$RES_DIR/mipmap-anydpi-v26/ic_launcher_round.xml" "$RES_DIR/drawable/ic_launcher_foreground.xml" "$RES_DIR/mipmap-anydpi-v26/ic_launcher_foreground.xml"
            declare -A ICON_SIZES=(
              ["mipmap-mdpi"]=48
              ["mipmap-hdpi"]=72
              ["mipmap-xhdpi"]=96
              ["mipmap-xxhdpi"]=144
              ["mipmap-xxxhdpi"]=192
            )
            for folder in "${!ICON_SIZES[@]}"; do
              px="${ICON_SIZES[$folder]}"
              mkdir -p "$RES_DIR/$folder"
              convert "logo.png" -resize "${px}x${px}!" "$RES_DIR/$folder/ic_launcher.png"
              convert "logo.png" -resize "${px}x${px}!" "$RES_DIR/$folder/ic_launcher_round.png"
              convert "logo.png" -resize "${px}x${px}!" "$RES_DIR/$folder/ic_launcher_foreground.png"
            done
          else
            echo "logo.png not found in repo root; skipping custom icon generation."
          fi
